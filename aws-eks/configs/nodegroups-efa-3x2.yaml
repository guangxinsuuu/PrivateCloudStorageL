apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: 3fs-demo
  region: us-east-1
managedNodeGroups:
  - name: storage-full
    instanceType: i3en.24xlarge
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    privateNetworking: true
    availabilityZones:
      - us-east-1a
    efaEnabled: true
    volumeSize: 100
    labels:
      role: storage
    taints:
      - key: role
        value: storage
        effect: NoSchedule
  - name: client-full
    instanceType: c7gn.16xlarge
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    availabilityZones:
      - us-east-1a
    efaEnabled: true
    volumeSize: 100
    labels:
      role: client
