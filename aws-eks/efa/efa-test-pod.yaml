apiVersion: v1
kind: Pod
metadata:
  name: efa-test
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    role: client
  containers:
    - name: efa-test
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      securityContext:
        privileged: true
      resources:
        requests:
          vpc.amazonaws.com/efa: "1"
        limits:
          vpc.amazonaws.com/efa: "1"
      command:
        - /bin/bash
        - -lc
        - |
          set -euo pipefail
          dnf install -y libfabric libfabric-devel rdma-core || true
          echo "=== fi_info -p efa ==="
          fi_info -p efa || true
          echo "=== ibv_devinfo ==="
          ibv_devinfo || true
          echo "=== sleep for inspection ==="
          sleep 3600
